name: Build and release Matter Manipulator 26.3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod JAR
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace build
      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: matter-manipulator-26.3-test-jar
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Create prerelease with JAR
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
          REVISION: ${{ github.sha }}
        run: |
          set -eu
          TAG="v0.1.0-alpha.${RUN_NUMBER}"
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          test -n "$JAR"
          gh release create "$TAG" "$JAR" --target "$REVISION" \
            --title "Matter Manipulator 26.3 alpha ${RUN_NUMBER}" \
            --notes "Experimental Fabric 26.3 port. Not GTNH feature-complete. See README and UPSTREAM.md." \
            --prerelease
